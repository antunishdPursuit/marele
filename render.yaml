# Render Blueprint: the hosted copy of the game. Marycel's steps come from the
# same fine-tuned checkpoint on Tinker; TINKER_API_KEY is set in the Render
# dashboard (sync: false keeps it out of this file).
services:
  - type: web
    name: marele
    runtime: python
    plan: free  # no card needed; sleeps after 15 idle minutes, first visit then takes about a minute
    buildCommand: pip install -r requirements.txt
    startCommand: python -u game/server.py
    healthCheckPath: /game/web/index.html
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: HOST
        value: 0.0.0.0
      - key: MARYCEL_BACKEND
        value: tinker
      - key: DAILY_STEP_LIMIT
        value: "6000"
      # the day's step count lives in the Key Value store below, so a restart or a
      # sleeping server doesn't reset it
      - key: KEY_VALUE_URL
        fromService:
          type: keyvalue
          name: marele-steps
          property: connectionString
      - key: TINKER_API_KEY
        sync: false
  - type: keyvalue
    name: marele-steps
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction  # a counter must never be evicted
    ipAllowList: []  # reachable only from the game service, inside Render
